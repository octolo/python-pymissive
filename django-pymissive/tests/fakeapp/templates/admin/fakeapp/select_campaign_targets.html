{% extends "admin/base_site.html" %}

{% block content %}
<p>{{ title }} — {{ queryset|length }} contact{{ queryset|length|pluralize }}.</p>
<ul>
  {% for obj in queryset %}
    <li>{{ obj }}</li>
  {% endfor %}
</ul>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  {% for obj in queryset %}
    <input type="hidden" name="{{ action_checkbox_name }}" value="{{ obj.pk }}">
  {% endfor %}
  <input type="hidden" name="action" value="{{ action }}">
  <input type="submit" name="apply" value="Confirm">
</form>
{% endblock %}
