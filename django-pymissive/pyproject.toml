[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-pymissive"
version = "1.1.1"
description = "Django library for multi-channel missive management (email, SMS, push, postal, etc.)"
readme = "README.md"
authors = [
    { name = "Octolo", email = "dev@octolo.tech" }
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",

    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
keywords = ["django", "missive"]
requires-python = ">=3.10"
dependencies = [
    "Django>=5.0",
    "django-providerkit>=1.1.1",
    "django-geoaddress>=1.0.2",
    "django-phonenumber-field[phonenumbers]>=7.0",
    "babel>=2.0",
    "pymissive>=1.1.1",
    "boto3>=1.28",
    "requests>=2.31",
    "requests>=2.31",  # La Poste, LRE (AR24)
    "phonenumbers>=8.13",  # Phone number validation
    "email-validator>=2.1",  # Email validation
]

[project.optional-dependencies]
dev = [
    "django-debug-toolbar>=6.3.0",
    "pytest>=8.0",
    "pytest-django>=4.8",
]
messaging = [
    "python-telegram-bot>=20.7",
    "requests>=2.31",
]
brevo = [
    "brevo-python>=4.0",
]
pdf = [
    "weasyprint>=60.0",
    "pypdf>=4.0",
    "reportlab>=4.0",
]
test = [
    "pytest>=8",
    "pytest-django>=4.8",
    "python-dotenv",
]


[project.urls]
Homepage = "https://github.com/octolo/python-missive"
Repository = "https://github.com/octolo/python-missive"
Documentation = "https://github.com/octolo/python-missive/django-missive#readme"
Issues = "https://github.com/octolo/python-missive/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["django_pymissive*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
django_pymissive = ["templates/**/*", "static/**/*", "locale/**/*", "migrations/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pylint.main]
ignore = ["migrations"]

[tool.django-stubs]
django_settings_module = "tests.settings"
