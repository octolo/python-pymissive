[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymissive"
version = "1.4.0"
description = "Framework-agnostic messaging library for multi-channel communication."
authors = [{ name = "Octolo", email = "dev@octolo.tech" }]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["messaging", "email", "sms", "missive", "multi-channel", "notification"]
dependencies = [
  "clicommands>=0.1.1",
  "providerkit>=1.1.1",
  "requests>=2.31",  # imported at module level by the maileva, scaleway and partner providers
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

# One extra per provider needing an SDK beyond requests. Each mirrors the
# provider's own ``required_packages``, and the imports are lazy, so a missing
# extra costs only that provider.
[project.optional-dependencies]
brevo = [
  "brevo-python>=4.0",
]
scaleway = [
  "boto3>=1.28",
]
discord = [
  "discord.py>=2.3",
]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
pymissive = "pymissive.cli:main"

[project.urls]
Homepage = "https://github.com/octolo/python-missive"
Repository = "https://github.com/octolo/python-missive"
Documentation = "https://github.com/octolo/python-missive/tree/main/python-pymissive#readme"
Issues = "https://github.com/octolo/python-missive/issues"

[tool.setuptools]
package-data = {pymissive = [".commands.json", "commands/_docs/*.md", "postal_tracking_urls.json"]}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--cov=pymissive", "--cov-report=term-missing"]
