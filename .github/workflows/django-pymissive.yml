name: CI django-pymissive

on:
  push:
    branches: ["main"]
    paths:
      - "django-pymissive/**"
      - ".github/workflows/django-pymissive.yml"
  pull_request:
    paths:
      - "django-pymissive/**"
      - ".github/workflows/django-pymissive.yml"
  workflow_dispatch:

jobs:
  test-django-pymissive:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        django-version: ["5.0.*", "5.1.*", "5.2.*"]

    defaults:
      run:
        working-directory: django-pymissive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies and local packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install "Django==${{ matrix.django-version }}"
          python -m pip install djangorestframework python-dotenv
          python -m pip install "pymissive @ git+https://github.com/SunnyBara/python-pymissive.git@c869c9f27c92ee657fc08204f0aac9a8af44dbe6#subdirectory=python-pymissive"
          python -m pip install "clicommands @ git+https://github.com/SunnyBara/python-clicommands.git@3d8b78ba62d1ff3fff0803060a467d8f44cbc86a"
          python -m pip install "providerkit @ git+https://github.com/SunnyBara/python-providerkit.git@601f27aaab01c8d9608551b38218861d917c19ee#subdirectory=python-providerkit"
          python -m pip install "django-providerkit @ git+https://github.com/SunnyBara/python-providerkit.git@601f27aaab01c8d9608551b38218861d917c19ee#subdirectory=django-providerkit"
          python -m pip install -e ../python-pymissive
          python -m pip install -e ".[test]"

      - name: Django system check
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test

      - name: Build package
        run: python -m build
