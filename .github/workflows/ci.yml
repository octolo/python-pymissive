name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned so a new ruff release cannot turn a green branch red on its own.
      - name: Install ruff
        run: python -m pip install ruff==0.15.18

      - name: Check
        run: ruff check python-pymissive/src django-pymissive/src

      - name: Install typing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./python-pymissive[dev]"
          python -m pip install -e "./django-pymissive[dev]"

      - name: Type check
        run: |
          (cd python-pymissive && mypy src/pymissive)
          (cd django-pymissive && mypy src/django_pymissive)

  tests:
    name: ${{ matrix.package_name }} tests py${{ matrix.python_version }} ${{ matrix.django_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package_name: ["pymissive", "django-pymissive"]
        python_version: ["3.11", "3.12", "3.13"]
        django_version: ["", "5.0.*", "5.1.*", "5.2.*"]
        exclude:
          - package_name: pymissive
            django_version: "5.0.*"
          - package_name: pymissive
            django_version: "5.1.*"
          - package_name: pymissive
            django_version: "5.2.*"
          - package_name: django-pymissive
            django_version: ""
          - package_name: django-pymissive
            python_version: "3.13"
            django_version: "5.0.*"
        include:
          - package_name: pymissive
            working_directory: python-pymissive
            test_command: python -m pytest
          - package_name: django-pymissive
            working_directory: django-pymissive
            test_command: python -m pytest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      # WeasyPrint wheels need Pango/HarfBuzz on the runner; without them the
      # [pdf] extra installs but 20 watermark/PDF tests stay silently skipped.
      - name: Install WeasyPrint system libraries
        if: ${{ matrix.package_name == 'django-pymissive' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install dependencies
        working-directory: ${{ matrix.working_directory }}
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.package_name }}" = "django-pymissive" ]; then
            # Install the local pymissive first so its (unreleased) version
            # satisfies the django-pymissive "pymissive>=x.y.z" constraint and
            # pip never tries to fetch it from PyPI.
            python -m pip install -e ../python-pymissive
            python -m pip install -e ".[test]"
            python -c "import pypdf, reportlab, weasyprint"
          else
            python -m pip install -e ".[test]"
          fi

      - name: Install Django
        if: ${{ matrix.package_name == 'django-pymissive' }}
        working-directory: ${{ matrix.working_directory }}
        run: python -m pip install "Django==${{ matrix.django_version }}"

      - name: Django system check
        if: ${{ matrix.package_name == 'django-pymissive' }}
        working-directory: ${{ matrix.working_directory }}
        run: python manage.py check

      - name: Run tests
        working-directory: ${{ matrix.working_directory }}
        run: ${{ matrix.test_command }}

  pymissive-install:
    name: pymissive non-editable import
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from the local sdist, not editable
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./python-pymissive
          python - <<'PY'
          from pymissive.providers.brevo import BrevoAPIProvider
          from pymissive.providers.scaleway import ScalewayProvider
          from pymissive.providers.maileva import MailevaProvider
          from pymissive.providers.partner import PartnerProvider
          from pymissive.providers.slack import SlackProvider
          from pymissive.providers.teams import TeamsProvider
          from pymissive.providers.discord import DiscordProvider
          from pymissive.providers.hand_delivery import HandDeliveryProvider

          for cls in (
              BrevoAPIProvider,
              ScalewayProvider,
              MailevaProvider,
              PartnerProvider,
              SlackProvider,
              TeamsProvider,
              DiscordProvider,
              HandDeliveryProvider,
          ):
              cls()
              print(cls.__name__)
          PY

  security:
    name: Security ${{ matrix.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: python-pymissive
            advisory: false
          - package: django-pymissive
            advisory: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tools
        run: python -m pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Static security scan
        id: bandit
        continue-on-error: ${{ matrix.advisory }}
        working-directory: ${{ matrix.package }}
        run: python -m bandit -q -r src -ll -ii
      - name: Report security findings
        if: steps.bandit.outcome == 'failure'
        run: |
          echo "::warning::Bandit reported findings or failed for ${{ matrix.package }}; see the security scan."
          echo "Bandit requires review for ${{ matrix.package }}." >> "$GITHUB_STEP_SUMMARY"
      - name: Audit runtime dependencies
        working-directory: ${{ matrix.package }}
        run: python -m pip_audit . --progress-spinner off

  build:
    name: Build ${{ matrix.package_name }}
    needs: [tests, pymissive-install, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_name: pymissive
            working_directory: python-pymissive
          - package_name: django-pymissive
            working_directory: django-pymissive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        working-directory: ${{ matrix.working_directory }}
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.package_name }}" = "django-pymissive" ]; then
            python -m pip install "Django==5.2.*"
            python -m pip install -e ../python-pymissive
          fi
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python ../.github/scripts/check-wheel-contents.py \
            --package "${{ matrix.package_name }}" dist/*.whl

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: built-wheels-${{ matrix.package_name }}
          path: ${{ matrix.working_directory }}/dist/*.whl
          if-no-files-found: error


  install-wheels:
    name: Install built wheels in a clean environment
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: "built-wheels*"
          path: ${{ runner.temp }}/built-wheels
          merge-multiple: true
      - name: Install and verify wheels outside the checkout
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=("$RUNNER_TEMP"/built-wheels/*.whl)
          if [ "${#wheels[@]}" -ne 2 ]; then
            echo "::error::Expected 2 built wheel(s), found ${#wheels[@]}."
            exit 1
          fi
          python - "${wheels[@]}" <<'PY'
          from email.parser import BytesParser
          import re
          import sys
          from zipfile import ZipFile

          names = []
          for wheel in sys.argv[1:]:
              with ZipFile(wheel) as archive:
                  metadata = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
                  if len(metadata) != 1:
                      raise SystemExit(f"Invalid wheel metadata: {wheel}")
                  name = BytesParser().parsebytes(archive.read(metadata[0]))["Name"]
                  if not name:
                      raise SystemExit(f"Missing wheel distribution name: {wheel}")
                  names.append(re.sub(r"[-_.]+", "-", name).lower())
          if sorted(names) != ['django-pymissive', 'pymissive']:
              raise SystemExit(f"Unexpected wheel distributions: {names}")
          PY
          python -m venv "$RUNNER_TEMP/wheel-test"
          unset PYTHONPATH
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install "${wheels[@]}" "Django==5.2.*"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip check
          "$RUNNER_TEMP/wheel-test/bin/python" - <<'PY'
          import importlib
          from importlib.metadata import distribution
          from pathlib import Path

          import django
          from django.conf import settings
          settings.configure(
              SECRET_KEY="wheel-smoke-test",
              INSTALLED_APPS=["django.contrib.contenttypes", "django.contrib.auth"],
              DATABASES={"default": {"ENGINE": "django.db.backends.sqlite3", "NAME": ":memory:"}},
          )
          django.setup()

          for name, module_name in [('pymissive', 'pymissive'), ('django-pymissive', 'django_pymissive')]:
              dist = distribution(name)
              module = importlib.import_module(module_name)
              location = Path(module.__file__).resolve()
              files = dist.files
              if files is None or location not in {Path(dist.locate_file(file)).resolve() for file in files}:
                  raise SystemExit(f"{module_name} was not imported from the installed {name} wheel: {location}")
              print(f"{name} {dist.version}: {location}")
          PY

  maintainability:
    name: Radon maintainability
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Radon
        id: radon_install
        continue-on-error: true
        run: python -m pip install radon==6.0.1
      - name: Report installation failure
        if: steps.radon_install.outcome == 'failure'
        run: |
          echo "::warning::Radon could not be installed; maintainability was not checked."
          echo "Radon could not be installed; maintainability was not checked." >> "$GITHUB_STEP_SUMMARY"
      - name: Report maintainability
        if: steps.radon_install.outcome == 'success'
        continue-on-error: true
        run: |
          for source in "django-pymissive/src" "python-pymissive/src"; do
            if ! report=$(python -m radon mi "$source" -s -e '*/migrations/*'); then
              echo "::warning::Radon could not generate the report for $source."
              exit 1
            fi
            printf '### Radon maintainability index: %s\n\n```\n%s\n```\n' "$source" "$report" >> "$GITHUB_STEP_SUMMARY"
          done

  local-audit:
    name: Full audit (progressive)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        id: audit_setup
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libharfbuzz-subset0
          python -m pip install -e "./python-pymissive[test]" -e "./django-pymissive[test]" "Django==5.2.*"
          python -m pip install "ruff==0.15.18" mypy bandit pip-audit vulture radon xenon pytest pytest-django pytest-cov build twine
      - name: Report setup failure
        if: steps.audit_setup.outcome == 'failure'
        run: |
          echo "::warning::Audit dependencies could not be installed; the full audit did not run."
          echo "Audit dependencies could not be installed; the full audit did not run." >> "$GITHUB_STEP_SUMMARY"
      - name: Run audit
        id: audit
        if: steps.audit_setup.outcome == 'success'
        continue-on-error: true
        run: make audit PYTHON=python
      - name: Report audit findings
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::warning::The full audit reported failures; see the audit step."
          echo "Full audit reported failures; see the audit step." >> "$GITHUB_STEP_SUMMARY"
