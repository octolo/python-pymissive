# Shared by both packages. Deliberately limited to the default rule set: it
# catches real errors (undefined names, dead imports, redefinitions) without
# reformatting or reordering the existing code.
target-version = "py310"
line-length = 120

[lint.per-file-ignores]
# Package roots exist to re-export; their imports are the API surface.
"__init__.py" = ["F401"]
